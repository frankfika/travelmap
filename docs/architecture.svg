<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" font-family="-apple-system, system-ui, sans-serif" fill="#0f172a">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dbeafe"/>
      <stop offset="1" stop-color="#f8fafc"/>
    </linearGradient>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="720" height="280" rx="14" fill="url(#g)"/>

  <!-- Browser UI -->
  <g transform="translate(30,30)">
    <rect width="170" height="50" rx="10" fill="#fff" stroke="#cbd5e1"/>
    <circle cx="22" cy="25" r="5" fill="#22c55e"/>
    <text x="38" y="29" font-size="12" fill="#475569">Floating input</text>
  </g>

  <g transform="translate(30,95)">
    <rect width="170" height="50" rx="10" fill="#fff" stroke="#cbd5e1"/>
    <text x="15" y="29" font-size="12" fill="#475569">React-Leaflet</text>
  </g>

  <g transform="translate(30,160)">
    <rect width="170" height="50" rx="10" fill="#fff" stroke="#cbd5e1"/>
    <text x="15" y="29" font-size="12" fill="#475569">Zustand · IDB</text>
  </g>

  <!-- lookupBoundary stack -->
  <g transform="translate(290,40)">
    <rect width="170" height="40" rx="8" fill="#fef3c7" stroke="#fbbf24"/>
    <text x="85" y="25" font-size="12" text-anchor="middle" fill="#92400e">Static OSM bundle</text>
  </g>
  <g transform="translate(290,90)">
    <rect width="170" height="40" rx="8" fill="#fef3c7" stroke="#fbbf24"/>
    <text x="85" y="25" font-size="12" text-anchor="middle" fill="#92400e">IDB persisted cache</text>
  </g>
  <g transform="translate(290,140)">
    <rect width="170" height="40" rx="8" fill="#fef3c7" stroke="#fbbf24"/>
    <text x="85" y="25" font-size="12" text-anchor="middle" fill="#92400e">Nominatim search</text>
  </g>
  <g transform="translate(290,190)">
    <rect width="170" height="40" rx="8" fill="#e2e8f0" stroke="#94a3b8"/>
    <text x="85" y="25" font-size="12" text-anchor="middle" fill="#475569">Reverse + circle fallback</text>
  </g>

  <!-- Output -->
  <g transform="translate(530,115)">
    <rect width="170" height="50" rx="10" fill="#dcfce7" stroke="#22c55e"/>
    <text x="85" y="22" font-size="12" text-anchor="middle" fill="#14532d" font-weight="600">World Boundary</text>
    <text x="85" y="38" font-size="10" text-anchor="middle" fill="#166534">GeoJSON · cached</text>
  </g>

  <!-- Arrows -->
  <line x1="205" y1="55" x2="280" y2="60" stroke="#94a3b8" marker-end="url(#ar)"/>
  <line x1="205" y1="120" x2="280" y2="110" stroke="#94a3b8" marker-end="url(#ar)"/>
  <line x1="205" y1="185" x2="280" y2="160" stroke="#94a3b8" marker-end="url(#ar)"/>
  <line x1="465" y1="100" x2="525" y2="135" stroke="#94a3b8" marker-end="url(#ar)"/>
  <line x1="465" y1="150" x2="525" y2="145" stroke="#94a3b8" marker-end="url(#ar)"/>
  <line x1="465" y1="200" x2="525" y2="155" stroke="#94a3b8" marker-end="url(#ar)"/>
</svg>
